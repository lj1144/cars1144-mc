
Dismantle:
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.Dismantle.cooldown> seconds."} @self
  Cooldown: 26
  Conditions:
  - crouching true
  - skillOnCooldown{skill=globalcooldown} false
  Skills:
  - skill{s=globalcooldown}
  - sound{s=entity.player.attack.crit;p=0.9} @self
  - sound{s=entity.illager.cast_spell;p=0.8} @self
  - sound{s=entity.generic.explode;p=0.5} @self
  - projectile{onTick=DismantleTick;onHit=DismantleHit;v=30;i=1;hR=2;vR=2;StopAtBlock=true;HitNonPlayers=true} @TargetLocation
DismantleTick:
  Skills:
  - effect:particles{color=#080404;amount=50;speed=0;hR=1;vR=1;hS=0.9;vS=0.9} @origin
  - slash{y=1.8;w=4;h=2;oh=cleavehit;mpd=true;a=180;oP=[ - effect:particles{p=SWEEP_ATTACK} ];roll=-45to100} @origin
  - slash{y=1.8;w=4;h=2;oh=cleavehit;mpd=true;a=180;oP=[ - effect:particles{p=SWEEP_ATTACK} ];roll=100to-45} @origin
DismantleHit:
  Skills:
  - damage{a=34;ia=false;preventimmunity=false;pk=false} @EntitiesNearOrigin{r=3}

  
