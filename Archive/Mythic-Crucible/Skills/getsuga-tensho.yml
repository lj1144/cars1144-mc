getsugatensho:
  Cooldown: 70
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.getsugatensho.cooldown> seconds."} @self
  Conditions:
  - crouching true
  - holding{m=oblivion_sword} true
  - skillOnCooldown{skill=globalcooldown} false
  Skills:
  - skill{s=globalcooldown}
  - effect:sound{s=entity.evoker.prepare_attack;v=2;p=0.7} @self
  - effect:sound{s=block.enchantment_table.use;v=2;p=1.5} @self
  - effect:sound{s=entity.ender_dragon.growl;v=2;p=0.3} @self
  - effect:sound{s=item.trident.riptide_3;v=2;p=0.5} @self
  - projectile{onTick=getsugaTick;onHit=getsugaHit;oE=getsugaEnd;v=16;i=1;hR=1.5;vR=1.5;StopAtBlock=true;HitNonPlayers=true} @TargetLocation
