LapseBlueSkill:
  Cooldown: 1
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.LapseBlueSkill.cooldown> seconds."} @self
  Conditions:
  - skillOnCooldown{skill=globalcooldown} false
  - holding{m=lapseblue} true
  Skills:
  - projectile{onTick=LapseBlue-Tick;sE=false;sB=false;onHit=LapseBlue-Hit;v=12;mr=20;d=100;hR=5;vR=5;hnp=true} @Forward{uel=true}
  - skill{s=globalcooldown}

LapseBlue-Tick:
  Skills:
  - effect:particlesphere{particle=reddust;color=#0000FF;a=100;r=0.8}
  - effect:particles{particle=reddust;color=#0000FF;a=100;offset=1.5} 
  - pull{v=7;to=true} @ENO{r=10;conditions=[  - notinregion{r=spawn} true  - notinregion{r=portalroom}  - notinregion{r=afk}]}
  - damage{a=16;i=false} @EntitiesNearOrigin{r=4}
  - sound{s=entity.enderman.teleport;volume=1.2;pitch=0.3} @origin
  - sound{s=block.beacon.activate;volume=0.9;pitch=0.5} @origin
  - sound{s=block.portal.trigger;volume=0.3;pitch=0.2} @origin
    # @EIR{r=10}

