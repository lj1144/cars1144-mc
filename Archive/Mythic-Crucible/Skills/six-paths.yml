  - potion{type=WEAKNESS;duration=20;level=1} @EIR{r=7}
  - pull{v=4;to=true;origin=@Forward{f=3;lockpitch=false;uel=true}} @EIR{r=25;conditions=[  - notinregion{r=spawn} true  - notinregion{r=portalroom}  - notinregion{r=afk}]}
