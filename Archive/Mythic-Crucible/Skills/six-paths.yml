AsuraPath:
  Cooldown: 43
  Conditions:
  - skillOnCooldown{skill=globalcooldown} false
  - holding{m=asura} true
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.AsuraPath.cooldown> seconds."} @self
  Skills:
  - skill{s=globalcooldown}
  - skill{s=asuraeff;repeat=3;repeatInterval=10} @EIR{r=25}
  
asuraeff:
  Skills:
  - effect:sound{s=entity.blaze.shoot;p=0.2;v=0.5} @self
  - effect:sound{s=block.beacon.ambient;v=0.4;p=1.8} @self
  - missile{ot=asuratick;oh=asurahit;v=12;i=1;hR=2;vR=2;in=0.10;sso=0;sfo=0;syo=1;md=400;mr=100} @T


asuratick:
  Skills:
  - effect:particles{p=reddust;a=1;color=#4B4B4B} @origin
  - effect:particles{p=reddust;a=1;color=#FF8C00} @origin

