  - effect:particles{p=reddust;color=#FF4500;a=400;hs=5;vs=5;offset=1;speed=0.1}
  - effect:particles{p=Explosion;a=400;offset=1;speed=0.1;hs=3;vs=3}
  - effect:sound{s=block.glass.break;p=1.3;v=0.3} @T
