freezetime:
  Cooldown: 120
  Skills:
  - effect:sound{s=entity.lightning_bolt.thunder;v=1;p=2} @self
  - effect:sound{s=entity.ender_eye.death;v=1;p=0.7} @self
  - effect:sound{s=entity.vex.death;v=0.5;p=1.3} @self
  - effect:sound{s=entity.lightning_bolt.thunder;v=1;p=2} @EIR{r=20}
  - effect:lightning{localized=false} @EIR{r=20}
  - damage{a=10;ia=false;preventimmunity=true;pk=true} @EIR{r=10}
  - modifytargetscore{objective=prayervalue;action=subtract;value=3} @self
  - stun{d=10;f=true} @EIR{r=10}
  - potion{type=SLOWNESS;duration=100;level=3} @EIR{r=10}
  - potion{type=BLINDNESS;duration=100;level=1} @EIR{r=10}
  - effect:particlesphere{color=#030000;amount=50;radius=10;y=1;repeat=120;repeatInterval=1} @Origin
  - sendtitle{title="&e&lThe World!";subtitle="&c&oThe World has been activated by (<caster.name>)";d=50} @PlayersInRadius{r=15}
  - sendtitle{title="&e&lThe World!";subtitle="&c&oThe World has been activated by (<caster.name>)";d=50} @self
  
  
