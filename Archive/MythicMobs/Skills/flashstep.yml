flashstep:
  Conditions:
  - crouching false
  Skills:
  - leap{velocity=2000} @targetlocation
  - effect:sound{s=entity.witch.throw;v=1;p=0.5} @self
  - skill{s=sacredtick;repeat=7;repeatInterval=1}

sacredtick:
  Skills:
  - effect:sound{s=entity.illusioner.cast_spell;v=0.3;p=2} @self
  - effect:particlesphere{particle=mobSpell;color=#FFB300;amount=15;radius=1} @self
  - velocity{m=add;x=0;y=-1;z=0} @self