overheat:
  Cooldown: 60
  Conditions:
  - skillOnCooldown{skill=globalcooldown} false
  - holding{m=overheat} true
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.overheat.cooldown> seconds."} @self
  Skills:
  - skill{s=globalcooldown}
  - skill{s=preoverheat;repeat=30;repeatInterval=1}
  - potion{t=SLOW;d=30;l=20;force=true} @Self
  - potion{t=RESISTANCE;d=20;l=20;force=true} @Self
  - delay 30
  - damagepercent{percent=0.35;ia=true;ie=true} @self
  - blockwave{r=24;v=2;d=40}
  - damagepercent{percent=0.35;ia=true;ie=true} @PIR{r=8}
  - effect:particles{p=redstone;amount=100;hS=12;vS=12;color=#FFD700;speed=0.5} @self
  - delay 2
  - effect:particles{p=redstone;amount=100;hS=8;vS=8;color=#FFD700;speed=0.1} @self
  - delay 2
  - effect:particles{p=redstone;amount=100;hS=8;vS=8;color=#FF4500;speed=0.1} @self
  - delay 2
  - effect:particles{p=redstone;amount=100;hS=8;vS=8;color=#FF4500;speed=0.1} @self
  - skill{s=overheatblast;repeat=10;repeatInterval=1} @self
overheatblast:
  Skills:
  - effect:particlesphere{particle=reddust;color=#FDB813;a=100;hs=8;vs=8} @self
  - effect:particlesphere{particle=reddust;color=#FDB813;a=100;hs=8;vs=8 @self
overhits:
  Skills:
  - damage{a=10;pi=false;ia=false;ie=true}
preoverheat:
  Skills:
  - effect:sound{s=block.blastfurnace.fire_crackle;v=0.3;p=0.1} @Self
  - effect:sound{s=item.firecharge.use;v=1;p=1.3} @Self
  - effect:sound{s=entity.evoker.prepare_attack;v=0.3;p=0.1} @Self
  - effect:sound{s=block.enchantment_table.use;v=1;p=1.3} @Self
  - effect:particles{p=reddust;amount=8;speed=0.1;hs=0.6;vs=1.05;y=0.7;color=#FF4500} @self
  - effect:particles{p=reddust;amount=8;speed=0.1;hs=0.6;vs=1.05;y=0.7;color=#FFD700} @self