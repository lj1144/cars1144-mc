greatrepel:
  Cooldown: 45
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.greatrepel.cooldown> seconds."} @self
  Conditions:
  - notinregion{r=koth} true
  - skillOnCooldown{skill=globalcooldown} false
  - holding{m=greatrepel} true
  TargetConditions:
  - notinregion{r=BossZone} true
  - notinregion{r=spawn} true
  - notinregion{r=portalroom} true
  - notinregion{r=afk} true
  Skills:
  - skill{s=globalcooldown}
  - skill{s=greatrepeltick;repeat=19;repeatInterval=1}
  #- effect:sound{s=block.beacon.activate;v=1.2;p=0.5} @self
  - effect:sound{s=block.conduit.activate;v=1.0;p=1.8} @self
  - effect:sound{s=entity.generic.explode;v=1.5;p=0.5} @self
  - throw{velocity=17;velocityY=8} @EIR{r=6;conditions=[  - notinregion{r=spawn} true  - notinregion{r=portalroom}  - notinregion{r=afk}]}
  - effect:particlesphere{color=#5C6E7D;amount=300;radius=6;y=1} @self



