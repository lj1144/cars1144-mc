fireflameflow:
  Conditions:
  - skillOnCooldown{skill=globalcooldown} false
  OnCooldownSkills:
  - am{m="&cSkill on cooldown for <caster.skill.fireflameflow.cooldown> seconds."} @self
  Cooldown: 20
  Skills:
  - skill{s=globalcooldown}
  - effect:sound{s=entity.illusioner.prepare_mirror;v=1;p=2} @self
  - effect:sound{s=block.enchantment_table.use;v=0.3;p=0.7} @self
  - skill{s=verlisify}
  - projectile{onTick=ezshootTick;onHit=ezshootHit;v=3;i=1;hR=1;vR=1;StopAtBlock=false;HitNonPlayers=true;g=-0.8;vO=-1.3;sfo=0;mr=3} @ring{radius=20;points=16}
ezshootTick:
  Skills:
  - effect:particles{color=#501611;amount=3;speed=0;hR=0.2;vR=0.2;hs=0.05;vs=0.1} @origin
ezshootHit:
  Skills:
 # - throw{velocity=10;velocityY=10} @EIR{r=3}
  - damage{a=6;ia=false;preventimmunity=true;pk=true} @EntitiesNearOrigin{r=3}
  - effect:sound{s=entity.shulker_bullet.hit;v=0.3;p=0.7}


  
verlisify:
  Cooldown: 0.1
  Skills:
  - effect:sound{s=entity.illusioner.prepare_blindness;v=1;p=0.7} @self
  - effect:sound{s=entity.blaze.shoot;v=0.3;p=2} @self
  - projectile{onTick=verlisifyTick;onHit=verlisifyHit;v=8;i=1;hR=1;vR=1;StopAtBlock=true;HitNonPlayers=true} @TargetLocation
verlisifyTick:
  Skills:
  - effect:particles{color=#270A08;amount=8;speed=0;hR=1;vR=1;hS=0.9;vS=0.9} @origin
  - effect:particles{p=mobSpell;amount=8;speed=0.5;hR=1;vR=1;hS=0.6;vS=0.6;color=#000000} @origin
verlisifyHit:
  Skills:
  - damage{a=34;ia=false;preventimmunity=false;pk=true} @EntitiesNearOrigin{r=3}
  - effect:sound{s=entity.ender_dragon.hurt;v=0.1;p=0.5}
  - effect:sound{s=entity.evoker.prepare_summon;v=0.1;p=2}